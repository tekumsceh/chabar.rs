<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f1e6d0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Listovi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="desk">
      <p class="desk-note">Džepni tourbook</p>
      <div class="phone">
        <div class="spine" aria-hidden="true"></div>
        <div class="app" id="shell">
          <div class="grain" aria-hidden="true"></div>
          <div class="margin" aria-hidden="true"></div>
          <div class="status-bar">
            <span class="brand">Listovi</span>
            <span class="running" id="running">tourbook</span>
            <span id="clock">13:01</span>
          </div>

          <header class="topbar">
            <button type="button" id="bar-left" class="bar-btn" aria-label="Prethodno">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <div class="bar-titles">
              <p id="bar-kicker">2026</p>
              <h1 id="bar-title">Kalendar</h1>
            </div>
            <button type="button" id="bar-right" class="bar-btn" aria-label="Sledeće">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </header>

          <main id="app" class="body"></main>

          <nav class="tabs" aria-label="Glavna navigacija">
            <button type="button" data-view="kalendar" aria-label="Kalendar">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="5.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M3.5 10.5h17M8 3.5v4M16 3.5v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span>Kalendar</span>
            </button>
            <button type="button" data-view="list" aria-label="List">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 3.5h8.2L19.5 8v12.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                <path d="M15 3.5V8h4.5M9 13h6M9 17h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span>List</span>
            </button>
            <button type="button" data-view="knjiga" aria-label="Knjiga">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5.5v14M5 6.2c2.2-1 4.4-.8 7-.2 2.6-.6 4.8-.8 7 .2v12.2c-2.2-1-4.4-.8-7 .2-2.6-.6-4.8-.8-7 .2V6.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              </svg>
              <span>Knjiga</span>
            </button>
            <button type="button" data-view="postava" aria-label="Postava">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8" />
                <circle cx="15.2" cy="8.4" r="1.9" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M4.6 18.5c.7-2.6 2.8-3.9 4.5-3.9 1.8 0 3.8 1.3 4.5 3.9M13.4 18.5c.4-1.5 1.6-2.6 3-2.6 1.5 0 2.7 1 3.2 2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span>Postava</span>
            </button>
          </nav>

          <div id="proof" class="sheet-root" hidden>
            <button type="button" class="sheet-dim" id="proof-stay" aria-label="Ostani na listu"></button>
            <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="proof-copy">
              <p class="kicker">Potvrda</p>
              <p id="proof-copy"></p>
              <button type="button" id="proof-ok" class="sheet-primary">Upiši u list</button>
              <button type="button" id="proof-undo" class="sheet-ghost">Vrati izmene</button>
              <button type="button" id="proof-stay-2" class="sheet-text">Ostani</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
